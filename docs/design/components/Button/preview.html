<!doctype html>
<html><head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="fe-col">
  <div class="fe-row" style="padding:0">
    <button class="fe-btn fe-btn-primary">Empezar entreno</button>
    <button class="fe-btn fe-btn-primary is-pressed">Pulsado</button>
    <button class="fe-btn fe-btn-secondary">Añadir ejercicio</button>
  </div>
  <div class="fe-row" style="padding:0">
    <button class="fe-btn fe-btn-ghost">+ Añadir serie</button>
    <button class="fe-btn fe-btn-danger">Descartar entreno</button>
    <button class="fe-btn fe-btn-secondary is-focus">Con foco</button>
    <button class="fe-btn fe-btn-primary" disabled>Desactivado</button>
  </div>
</div>
</body></html>
