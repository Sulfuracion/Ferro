<!doctype html>
<html><head><meta charset="utf-8"><title>RestTimer</title></head>
<body>
<div style="padding:var(--space-4) var(--space-4) 0;max-width:420px">
  <div class="fe-rest" role="timer" aria-label="Descanso, 1 minuto 24 segundos">
    <div class="fe-rest-track"><div class="fe-rest-fill" style="width:62%"></div></div>
    <div class="fe-rest-body">
      <div><div class="fe-rest-label">Descanso</div><div class="fe-rest-time">1:24</div></div>
      <div class="fe-rest-actions">
        <button class="fe-btn fe-btn-secondary" aria-label="Restar 15 segundos">−15</button>
        <button class="fe-btn fe-btn-secondary" aria-label="Sumar 15 segundos">+15</button>
        <button class="fe-btn fe-btn-ghost">Saltar</button>
      </div>
    </div>
  </div>
</div>
</body></html>
